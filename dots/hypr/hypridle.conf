# ============================================================================
# GPS Idle Management — hypridle 0.1.8
# Managed configuration for session locking, display dimming, DPMS, and suspend
# ============================================================================

general {
    lock_cmd = $HOME/Projects/my-rice/scripts/gps-lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
    inhibit_sleep = 2
}

# 1. After 150 seconds: dim display backlight to safe nonzero brightness
listener {
    timeout = 150
    on-timeout = $HOME/Projects/my-rice/scripts/gps-idle-bright dim
    on-resume = $HOME/Projects/my-rice/scripts/gps-idle-bright restore
}

# 2. After 300 seconds: lock the session
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 3. After 330 seconds: turn displays off via Hyprland 0.57 Lua dispatcher
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 4. After 1200 seconds: suspend only if confirmed on battery power
listener {
    timeout = 1200
    on-timeout = $HOME/Projects/my-rice/scripts/gps-idle-suspend
}
