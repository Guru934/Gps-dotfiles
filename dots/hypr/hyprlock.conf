# ============================================================================
# GPS Lockscreen v2 — hyprlock 0.9.x
# Redesign of the Stitch "Hyprlock // QuickShell Next-Gen Lockscreen" for GPS.
#
# Integration (unchanged from v1):
#   colours      <- ~/.config/hypr/lock-colors.conf   (set_wallpaper.py)
#   background   <- ~/.config/hypr/lock-bg.conf       (gps-lock-bg)
#   profile pic  <- ~/.config/gps/lock-avatar.conf   (gps-lock-avatar)  NEW
#   live values  <- scripts/lock-info.sh + scripts/lock-extra.sh
#
# Canvas: this layout is drawn for the real panel, 1920x1200 PHYSICAL pixels.
#   hyprlock does NOT apply the 1.5 monitor scale to sizes/positions/fonts, so
#   the old 1280x800 layout showed up as a small box in the middle of the screen.
#
# Position rules (verified for v1, kept):
#   halign left   : x = offset from screen left edge   (+N right)
#   halign right  : x = offset from screen right edge  (negative = inward)
#   halign center : x = offset from screen centre      (+N right)
#   valign center : y = offset from screen centre      (+N up)
#
# Font sizes are points: a monospace glyph is ~0.8 x font_size px wide.
# hyprlock sorts widgets by zindex with an UNSTABLE sort, so every widget has an
# explicit zindex.  Tiers: 1 pill/card glow, 2 card body, 3 inner surfaces,
# 4 text, 5 icons/avatar, 6 input field.
# ============================================================================

# Default fallback tokens (overwritten by lock-colors.conf when present)
$wallpaper = screenshot
$colorBackdrop = rgba(10, 14, 23, 0.42)
$colorBackdropSolid = rgba(10, 14, 23, 0.55)
$colorSurface = rgba(10, 14, 23, 0.72)
$colorCard = rgba(28, 31, 41, 0.85)
$colorCardSoft = rgba(28, 31, 41, 0.55)
$colorCardHover = rgba(28, 31, 41, 0.95)
$colorAccent = rgba(87, 241, 219, 1.0)
$colorAccentAlpha = rgba(87, 241, 219, 0.30)
$colorAccentBorder = rgba(87, 241, 219, 0.25)
$colorAccentBorderSoft = rgba(87, 241, 219, 0.14)
$colorAccentMuted = rgba(87, 241, 219, 0.65)
$colorAccentSubtle = rgba(87, 241, 219, 0.06)
$colorSecondary = rgba(221, 184, 255, 1.0)
$colorSecondarySubtle = rgba(221, 184, 255, 0.05)
$colorSecondaryAlpha = rgba(221, 184, 255, 0.16)
$colorText = rgba(223, 226, 239, 1.0)
$colorTextMuted = rgba(186, 202, 197, 0.85)
$colorTextSubtle = rgba(186, 202, 197, 0.55)
$colorFail = rgba(255, 92, 119, 0.95)
$colorCheck = rgba(87, 241, 219, 0.95)
$colorCaps = rgba(255, 212, 123, 0.95)

# Profile picture + media-art fallbacks (real files are created by gps-lock-avatar)
$avatar = ~/.cache/gps/lock/avatar-default.png
$artFallback = ~/.cache/gps/lock/art-default.png

# Dynamic parts generated by the GPS pipeline (gps-lock makes sure they exist)
source = ~/.config/hypr/lock-colors.conf
source = ~/.config/hypr/lock-bg.conf
source = ~/.config/gps/lock-avatar.conf

# Fonts. Outfit is the Stitch display font; if it is not installed fontconfig
# falls back to a default sans. Change $fontClock to "DejaVu Sans" to force it.
$fontUi = Liberation Sans
$fontUiBold = Liberation Sans Bold
$fontMono = JetBrainsMono Nerd Font
$fontClock = Outfit Light

# Live data sources
$info = $GPS_ROOT/scripts/lock-info.sh
$extra = $GPS_ROOT/scripts/lock-extra.sh

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    bezier = easeOut, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 6, easeOut
    animation = fadeOut, 1, 6, easeOut
    animation = inputFieldDots, 1, 2, linear
}

# Wallpaper only: blurred and dimmed. (The old full-screen 1280x800 "backdrop"
# rectangle and the hard-edged light-leak discs are gone: hyprlock shapes have no
# blur, so they showed up as visible boxes/circles instead of soft glows.)
background {
    monitor =
    path = $wallpaper
    blur_passes = 2
    blur_size = 8
    contrast = 1.0
    brightness = 0.55
    vibrancy = 0.10
    vibrancy_darkness = 0.35
    zindex = 0
}

