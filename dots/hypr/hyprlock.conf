# ============================================================================
# Aetheric Lockscreen — hyprlock 0.9.6
# Design reference: ~/Projects/my-rice/design_refs/Lockscreen.html
# Target canvas: 1280x800 logical (design artboard).
#
# Conventions (verified empirically):
#   halign left:   x = offset from screen left edge  (+N right)
#   halign right:  x = offset from screen right edge (negative = inward)
#   halign center: x = offset from screen center     (+N right)
#   valign center: y = offset from screen center     (+N up)
#   i.e. center formula: position = (target_x - 640, 400 - target_y)
#
# hyprlock sorts widgets by zindex with an UNSTABLE sort; every widget
# therefore gets an explicit zindex or layering is random.
#
# Config-value restrictions (discovered in sandbox testing):
#   - "#" anywhere in a value starts a comment -> colors only via `color =`
#   - "$(...)" is parsed as an expression -> all dynamic shell lives in
#     scripts/lock-info.sh
#   - label colors do not support gradients
# ============================================================================

$fontUi = Liberation Sans
$fontMono = JetBrainsMono Nerd Font
$info = $HOME/Projects/my-rice/scripts/lock-info.sh

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    bezier = easeOut, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 6, easeOut
    animation = fadeOut, 1, 6, easeOut
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 8
    contrast = 1.0
    brightness = 0.55
    vibrancy = 0.10
    vibrancy_darkness = 0.35
    zindex = 0
}

