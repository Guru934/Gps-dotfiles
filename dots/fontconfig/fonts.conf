<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  GPS Desktop Unified Font Configuration
  User-space fontconfig rules for Aetheric Shell / GPS.
  - Scale 1.5x / HiDPI-tuned text rendering: slight hinting, OLED-agnostic rgba=none
  - Preferred primary families: Plus Jakarta Sans (UI), JetBrains Mono / JetBrainsMono Nerd Font (mono)
  - Comprehensive international fallbacks: Devanagari (Hindi conjuncts), Japanese (CJK JP),
    Korean (CJK KR), and Noto Color Emoji
-->
<fontconfig>

  <!-- =================================================================== -->
  <!-- 1. Text Rendering Properties (OLED-agnostic subpixel & 1.5x scale)   -->
  <!-- =================================================================== -->
  <match target="font">
    <edit name="antialias" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="hinting" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="hintstyle" mode="assign">
      <const>hintslight</const>
    </edit>
    <edit name="rgba" mode="assign">
      <!-- none ensures OLED and varied subpixel layouts avoid color fringing -->
      <const>none</const>
    </edit>
    <edit name="autohint" mode="assign">
      <bool>false</bool>
    </edit>
    <edit name="lcdfilter" mode="assign">
      <const>lcddefault</const>
    </edit>
  </match>

  <!-- =================================================================== -->
  <!-- 2. Typography Aliases & Installed Nerd Font Bridge                  -->
  <!-- =================================================================== -->

  <!-- Map "JetBrains Mono" requests to installed "JetBrainsMono Nerd Font" -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>JetBrains Mono</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>JetBrainsMono Nerd Font</string>
    </edit>
  </match>

  <!-- Map "Plus Jakarta Sans" requests to Noto Sans fallback when missing -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>Plus Jakarta Sans</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Sans</string>
      <string>Noto Sans Devanagari</string>
      <string>Noto Sans CJK JP</string>
      <string>Noto Sans CJK KR</string>
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <!-- =================================================================== -->
  <!-- 3. Default Generic Fallback Preference Chains                       -->
  <!-- =================================================================== -->

  <!-- Sans-serif: Plus Jakarta Sans -> Noto Sans -> Devanagari -> JP -> KR -> Emoji -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Plus Jakarta Sans</family>
      <family>Noto Sans</family>
      <family>Noto Sans Devanagari</family>
      <family>Noto Sans CJK JP</family>
      <family>Noto Sans CJK KR</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Monospace: JetBrains Mono / NF -> Noto Sans Mono -> Devanagari -> JP -> KR -> Emoji -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrains Mono</family>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Sans Mono</family>
      <family>Noto Sans Devanagari</family>
      <family>Noto Sans Mono CJK JP</family>
      <family>Noto Sans Mono CJK KR</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Serif: Noto Serif -> Devanagari -> JP -> KR -> Emoji -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Serif Devanagari</family>
      <family>Noto Serif CJK JP</family>
      <family>Noto Serif CJK KR</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- System-wide Emoji alias -->
  <alias>
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Ensure color emoji is available across sans, serif, and monospace fallbacks -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <!-- =================================================================== -->
  <!-- 4. Language-Specific Prioritization (Devanagari, Japanese, Korean)  -->
  <!-- =================================================================== -->

  <!-- Hindi / Devanagari (lang=hi) -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>hi</string>
    </test>
    <test qual="any" name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Devanagari</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>hi</string>
    </test>
    <test qual="any" name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Devanagari</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>hi</string>
    </test>
    <test qual="any" name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif Devanagari</string>
    </edit>
  </match>

  <!-- Japanese (lang=ja) - Prioritizes JP glyph variants over KR -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ja</string>
    </test>
    <test qual="any" name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK JP</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ja</string>
    </test>
    <test qual="any" name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Mono CJK JP</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ja</string>
    </test>
    <test qual="any" name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK JP</string>
    </edit>
  </match>

  <!-- Korean (lang=ko) - Prioritizes KR glyph variants over JP -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ko</string>
    </test>
    <test qual="any" name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK KR</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ko</string>
    </test>
    <test qual="any" name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Mono CJK KR</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ko</string>
    </test>
    <test qual="any" name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK KR</string>
    </edit>
  </match>

</fontconfig>
